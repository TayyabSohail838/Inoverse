# Watches the live site. Every 30 minutes it checks that the site answers and can reach its
# database; once a day it also tries every API route signed out (scripts/security-check.mjs).
# If a check fails, GitHub emails you (Settings → Notifications → Actions: failed workflows).
name: Live site health

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "15 4 * * *" # daily, 09:15 in Pakistan: also the route check
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://inoverse-ai.vercel.app

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site answers and reaches its database
        run: |
          for try in 1 2 3; do
            body=$(curl -fsS --max-time 20 "$SITE/api/status") && break
            echo "Try $try failed; waiting 20 s"; sleep 20
          done
          [ -n "$body" ] || { echo "::error::$SITE/api/status didn't answer"; exit 1; }
          echo "$body" | jq -e '.supabase.ok == true' >/dev/null || { echo "::error::The site can't reach its database: $(echo "$body" | jq -c .supabase)"; exit 1; }
          echo "$body" | jq -e '.auth.required == true and .demo == false' >/dev/null || { echo "::error::Sign-in is off or the site is in demo mode: $(echo "$body" | jq -c '{demo, auth: .auth.required}')"; exit 1; }
          echo "$body" | jq -e '.gemma.configured == true' >/dev/null || { echo "::error::The AI key is missing"; exit 1; }
          echo "Healthy."
      - name: Home page loads
        run: curl -fsS --max-time 20 -o /dev/null "$SITE/"

  routes:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every API route refuses visitors who aren't signed in
        run: node scripts/security-check.mjs "$SITE"
